name: Reproduce the fixed corpus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/filingtime-uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/filingtime-python
      PIP_CACHE_DIR: ${{ runner.temp }}/filingtime-pip-cache
      PYTHONUTF8: "1"
    steps:
      - name: Check out exact repository bytes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.10"
          python-version: "3.12"
          enable-cache: false
      - name: Install exactly the locked environment
        run: uv sync --frozen
      - name: Check source and test style
        run: uv run --frozen --offline ruff check src tests scripts
      - name: Reproduce and verify offline
        run: uv run --frozen --offline python scripts/reproduce.py --root . --work-dir "${{ runner.temp }}/filingtime-reproduce"
      - name: Confirm committed artifacts were not changed
        run: git diff --exit-code
