[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filingtime"
version = "0.1.0"
description = "Evidence-linked point-in-time revenue reconstruction from original SEC filings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Rikkiio"}]
dependencies = [
  "arelle-release>=2.37,<3",
  "duckdb>=1.3,<2",
  "httpx>=0.28,<1",
  "pyarrow>=19,<25",
]

[project.scripts]
filingtime = "filingtime.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "matplotlib>=3.10,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/filingtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/filingtime/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
